<script>
  // Invisível: só segura a conexão com o servidor local figma-mcp-lite e avisa
  // o code.js quando o estado muda (o code.js mostra na notificação do rodapé).
  const PORT = 3055;
  let ws = null;
  let info = null;
  const state = (s) => parent.postMessage({ pluginMessage: { state: s } }, '*');

  function connect() {
    // O manifest do Figma só aceita nome de host (IP é "URL inválida"); o
    // servidor escuta em 127.0.0.1 e ::1, então localhost cai em um dos dois.
    ws = new WebSocket('ws://localhost:' + PORT);
    ws.onopen = () => {
      state('conectado, rodando em segundo plano');
      ws.send(JSON.stringify({ hello: 'plugin', info }));
    };
    // Keep-alive: um ping a cada 20s mantém a conexão (e o plugin) ativos.
    clearInterval(window.__ping);
    window.__ping = setInterval(() => { if (ws && ws.readyState === 1) ws.send('{"ping":1}'); }, 20000);
    ws.onmessage = (e) => parent.postMessage({ pluginMessage: JSON.parse(e.data) }, '*');
    ws.onclose = () => { state('aguardando o agente'); setTimeout(connect, 2000); };
    ws.onerror = () => {};
  }

  onmessage = (e) => {
    const msg = e.data.pluginMessage;
    if (!msg) return;
    if (msg.info) { info = msg.info; if (!ws) connect(); return; }
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
  };
</script>
